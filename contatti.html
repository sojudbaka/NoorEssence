<!DOCTYPE html>
<html lang="it">
<head>
    <script type="text/javascript" 
    src="https://embeds.iubenda.com/widgets/3edede56-dad0-4b89-92db-e15ba53be84f.js">

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti - Noor Essence</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a !important;
            margin: 0;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        .main-wrapper {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('sfondochisiamo.png') !important; 
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            width: 100% !important;
            padding: 20px 40px !important;
            box-sizing: border-box !important;
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-radius: 20px !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            margin-top: 20px;
        }

        .nav-logo { height: 65px !important; width: auto !important; object-fit: contain !important; display: block !important; }
        .nav-center-content { display: flex !important; flex-direction: column !important; align-items: center !important; flex-grow: 1 !important; text-align: center !important; }
        .nav-title-sparkle { font-family: 'Playfair Display', serif !important; font-size: 34px !important; color: #f5dc8c !important; margin: 0 0 12px 0 !important; letter-spacing: 4px !important; text-transform: uppercase !important; font-weight: 400 !important; }
        .nav-links { display: flex !important; gap: 30px !important; justify-content: center !important; align-items: center !important; }
        .nav-links a { color: #ffffff !important; text-decoration: none !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; font-weight: 400 !important; letter-spacing: 2px !important; text-transform: uppercase !important; transition: color 0.3s ease !important; }
        .nav-links a:hover { color: #f5dc8c !important; }
        .hamburger-btn { display: none !important; }

        /* --- CONTENUTO CONTATTI --- */
        .page-title { font-family: 'Playfair Display', serif; font-size: 40px; color: #f5dc8c; margin-top: 40px; margin-bottom: 10px; letter-spacing: 3px; text-transform: uppercase; }
        .gold-divider { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, #f5dc8c, transparent); margin-bottom: 40px; }

        .contact-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 60px;
            box-sizing: border-box;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #f5dc8c; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        
        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #f5dc8c;
            background: rgba(255, 255, 255, 0.08);
        }

        .submit-btn {
            background: transparent;
            border: 1px solid #f5dc8c;
            color: #f5dc8c;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #f5dc8c;
            color: #0a0a0a;
            box-shadow: 0 0 15px rgba(245, 220, 140, 0.4);
        }

        .social-info {
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }

        .social-info p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 15px; }
        .social-link { color: #f5dc8c; text-decoration: none; font-weight: 500; font-size: 15px; letter-spacing: 1px; }
        .social-link:hover { text-decoration: underline; }

        /* 1. DI BASE SUL COMPUTER: L'hamburger è nascosto e i link si vedono normalmente */
.menu-toggle {
    display: none !important; /* Nasconde le tre linee sul computer fisso */
}

.nav-links {
    display: block !important; /* Fa rivedere subito tutti i tuoi link sul computer */
}

/* 2. SOLO SUI TELEFONI: Si nascondono i link e compare l'hamburger */
@media (max-width: 768px) {
    .nav-links {
        display: none !important; /* Si nascondono sul telefono per fare ordine */
        flex-direction: column !important;
        width: 100% !important;
        position: absolute !important;
        top: 100% !important;
        left: 0 !important;
        background: rgba(15, 10, 12, 0.95) !important;
        backdrop-filter: blur(10px) !important;
        padding: 20px 0 !important;
    }

    .nav-links.active {
        display: flex !important; /* Ricompare solo se ci clicchi da telefono */
    }

    .menu-toggle {
        display: block !important; /* Mostra le tre linee solo sul telefono */
        cursor: pointer !important;
        margin: 10px auto 0 auto !important;
    }

    .bar {
        display: block !important;
        width: 25px !important;
        height: 3px !important;
        margin: 5px auto !important;
        background-color: #f5dc8c !important;
    }
}
    </style>
</head>
<body>

<div class="main-wrapper">
    <header style="width: 95%; margin-top: 20px;">
        <nav class="navbar">
            <img src="logo.png.png" alt="Noor Logo" class="nav-logo">
            <div class="nav-center-content">
                <h1 class="nav-title-sparkle">Noor Essence</h1>
                <div class="menu-toggle" id="mobile-menu">
    <span class="bar"></span>
</div>
                <div class="nav-links" id="nav-menu">
                    <a href="index.html">HOME</a>
                    <a href="chisiamo.html">CHI SIAMO</a>
                    <a href="orientali.html">ORIENTALI</a>
                    <a href="esotici.html">ESOTICI</a>
                    <a href="uomo.html">UOMO</a>
                    <a href="contatti.html">CONTATTI</a>
                </div>
            </div>
        </nav>
    </header>

    <h2 class="page-title">Contattaci</h2>
    <div class="gold-divider"></div>

    <div class="contact-container">
        <form action="#">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" class="form-control" placeholder="Inserisci il tuo nome">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Inserisci la tua email">
            </div>
            <div class="form-group">
                <label>Messaggio</label>
                <textarea class="form-control" rows="5" placeholder="Come possiamo aiutarti?"></textarea>
            </div>
            <button type="submit" class="submit-btn">Invia Messaggio</button>
        </form>
        <!-- SEZIONE TELEFONO E SOCIAL -->
        <div class="contact-info-footer">
            
            <!-- Telefono -->
            <div class="info-item">
                <p>📞 Servizio Clienti / WhatsApp</p>
                <a href="tel:+393955962436" class="contact-link">+39 395 596 2436</a>
            </div>

        <div class="social-info">
            <p>Segui il nostro viaggio olfattivo su Instagram:</p>
            <a href="#" class="social-link">@noor.essence</a>
        </div>
    </div>
</div>

</body>
</html>
